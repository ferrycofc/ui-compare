name: build-and-capture

# 每次推送到 main：
#   build   —— 在 windows-2025（x64）上编译每个技术的程序，测体积、内存、启动时间
#   capture —— 在 windows-11-arm（真正的 Windows 11）上运行同一个 x64 程序，截图并录操作视频
#   collect —— 结果放到 shots 分支的 latest/<技术>/，编译好的程序打包发到 Releases（nova-builds）
# 只想跑其中几个技术时，在 ci-apps.txt 里写它们的目录名（每行一个），写 all 或留空就是全部。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          all=$(ls apps/*/app.json | cut -d/ -f2)
          want=$(grep -v '^#' ci-apps.txt 2>/dev/null | tr -d ' \r' | grep -v '^$' || true)
          if [ -z "$want" ] || [ "$want" = "all" ]; then want="$all"; fi
          json=$(printf '%s\n' $want | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      OUT: out/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          pwsh -NoProfile -File ./apps/${{ matrix.app }}/build.ps1 2>&1 | Tee-Object -FilePath "$env:OUT/build.log"
          $code = $LASTEXITCODE
          if ($code -or -not (Test-Path ./apps/${{ matrix.app }}/dist)) { Write-Host "::error::build failed ($code)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          compression-level: 3
          retention-days: 30

      - name: Prepare desktop
        shell: pwsh
        run: ./tools/setup-desktop.ps1 -OutDir "$env:OUT/desktop-x64"

      - name: Measure
        timeout-minutes: 15
        shell: pwsh
        run: ./tools/capture.ps1 -App ${{ matrix.app }} -Dist apps/${{ matrix.app }}/dist -OutDir $env:OUT -Metrics -Suffix "-x64"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x64-${{ matrix.app }}
          path: out/
          if-no-files-found: ignore

  capture:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      OUT: out/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: dist-${{ matrix.app }}
          path: dist/${{ matrix.app }}

      - name: Check build
        if: steps.dl.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::No build for ${{ matrix.app }}"
          exit 1

      - name: Prepare desktop
        shell: pwsh
        run: ./tools/setup-desktop.ps1 -OutDir "$env:OUT/desktop-arm"

      - name: Get ffmpeg
        shell: pwsh
        run: ./tools/get-ffmpeg.ps1

      - name: Screenshots and video
        timeout-minutes: 20
        shell: pwsh
        run: ./tools/capture.ps1 -App ${{ matrix.app }} -Dist dist/${{ matrix.app }} -OutDir $env:OUT -Video

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-${{ matrix.app }}
          path: out/
          if-no-files-found: ignore

  collect:
    needs: [plan, build, capture]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to shots branch
        run: |
          cp tools/summary.py "$RUNNER_TEMP/summary.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin shots; then
            git fetch origin shots
            git checkout -B shots origin/shots
          else
            git checkout --orphan shots
            git rm -rf --quiet .
          fi
          # 旧版本的扁平结构不再需要
          rm -rf latest/windows-2025 latest/windows-11-arm latest/icons

      - uses: actions/download-artifact@v4
        with:
          pattern: x64-*
          path: ${{ runner.temp }}/new
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: arm-*
          path: ${{ runner.temp }}/new
          merge-multiple: true

      - name: Replace results of apps that produced new files
        run: |
          mkdir -p latest
          for d in "$RUNNER_TEMP"/new/*/; do
            [ -d "$d" ] || continue
            a=$(basename "$d")
            rm -rf "latest/$a"
            cp -r "$d" "latest/$a"
            echo "updated $a"
          done

      - name: Summary
        run: |
          python3 -m pip install --quiet pillow
          python3 "$RUNNER_TEMP/summary.py" latest
          cat latest/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "build: ${{ needs.build.result }}  capture: ${{ needs.capture.result }}"
            date -u
          } > latest/RUN.txt
          git add -A latest
          git commit -q -m "Results for ${GITHUB_SHA::7}" || echo "nothing to commit"
          git push origin shots

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dists

      - name: Publish builds to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p zips
          for d in dists/dist-*; do
            [ -d "$d" ] || continue
            app=${d#dists/dist-}
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/zips/Nova-$app-win-x64.zip" .)
          done
          ls -la zips
          if ! gh release view nova-builds >/dev/null 2>&1; then
            gh release create nova-builds --title "编译好的程序（Windows x64）" \
              --notes "每个技术一个 zip，解压后直接运行里面的 exe。UWP 需要先运行 install.ps1 安装。由 GitHub Actions 自动编译。"
          fi
          if ls zips/*.zip >/dev/null 2>&1; then gh release upload nova-builds zips/*.zip --clobber; fi
